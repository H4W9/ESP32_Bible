name: Build Firmware

on:
  push:
    branches: [main, master]
    tags: ['v*']            # a v* tag push also cuts a release
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Create/refresh a GitHub release with the artifacts'
        type: boolean
        default: false

permissions:
  contents: write           # needed by the (optional) release step

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # finish all three builds even if one fails
      matrix:
        include:

          # ── Pancake (ESP32-C5, 8 MB flash, PSRAM) ────────────────────────
          - board:      MARAUDER_PANCAKE
            short:      pancake
            fqbn:       "esp32:esp32:esp32c5:CDCOnBoot=default,CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=8M,PSRAM=enabled,PartitionScheme=custom,UploadSpeed=921600"
            tft_setup:  User_Setup_marauder_pancake
            partitions: partitions_backup/partitions_8mb.csv
            max_size:   3604480   # ota_0 slot size (0x370000)

          # ── V8 (ESP32-C5, 8 MB flash, PSRAM) ──────────────────────────────
          - board:      MARAUDER_V8
            short:      v8
            fqbn:       "esp32:esp32:esp32c5:CDCOnBoot=default,CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=8M,PSRAM=enabled,PartitionScheme=custom,UploadSpeed=921600"
            tft_setup:  User_Setup_marauder_v8
            partitions: partitions_backup/partitions_8mb.csv
            max_size:   3604480   # ota_0 slot size (0x370000)

          # ── V6.1 (original ESP32, 4 MB flash) ────────────────────────────
          - board:      MARAUDER_V6_1
            short:      v6_1
            fqbn:       "esp32:esp32:esp32:CPUFreq=240,FlashFreq=80,FlashMode=dio,FlashSize=4M,PartitionScheme=custom,UploadSpeed=921600"
            tft_setup:  User_Setup_og_marauder
            partitions: partitions_backup/partitions_4mb_dualboot.csv
            max_size:   1769472   # ota_0 slot size (0x1B0000)

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. arduino-cli ─────────────────────────────────────────────────────
      - name: Set up arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # ── 3. ESP32 core (cached) ─────────────────────────────────────────────
      - name: Cache ESP32 Arduino core
        uses: actions/cache@v4
        id: esp32-core-cache
        with:
          path: ~/.arduino15
          key: esp32-core-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Install ESP32 Arduino core
        if: steps.esp32-core-cache.outputs.cache-hit != 'true'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Restore arduino-cli config (cache hit path)
        if: steps.esp32-core-cache.outputs.cache-hit == 'true'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      # ── 3b. NimBLE-Arduino (needed by VerseBroadcast.cpp) ──────────────────
      # Installed into the user libraries dir where arduino-cli compile finds it
      # automatically (unlike the bundled TFT_eSPI, which is passed via --library).
      # Runs every build (the ~/Arduino libraries dir isn't part of the core cache).
      - name: Install NimBLE-Arduino
        run: |
          arduino-cli lib update-index
          arduino-cli lib install "NimBLE-Arduino"

      # ── 4. Per-board configuration ─────────────────────────────────────────
      # Patch configs.h (board #define) and User_Setup_Select.h (TFT driver
      # include) for this matrix entry, then copy the correct partitions.csv.
      - name: Configure for ${{ matrix.board }}
        env:
          BOARD:      ${{ matrix.board }}
          TFT_SETUP:  ${{ matrix.tft_setup }}
          PARTITIONS: ${{ matrix.partitions }}
        run: |
          python3 - <<'PYEOF'
          import re, os

          board     = os.environ["BOARD"]
          tft_setup = os.environ["TFT_SETUP"]

          # ── configs.h ──────────────────────────────────────────────────
          path = "bible_firmware/configs.h"
          with open(path) as f:
              text = f.read()
          # Comment out every board define
          text = re.sub(
              r'^[ \t]*(?://[ \t]*)?#define (MARAUDER_PANCAKE|MARAUDER_V8|MARAUDER_V6_1)',
              r'// #define \1', text, flags=re.MULTILINE)
          # Uncomment just the target
          text = re.sub(r'// #define ' + re.escape(board), '#define ' + board, text)
          with open(path, 'w') as f:
              f.write(text)
          print(f"configs.h  → #define {board}")

          # ── User_Setup_Select.h ────────────────────────────────────────
          path = "bible_firmware/libraries/TFT_eSPI-ESP32-C5/User_Setup_Select.h"  # now permanent location
          with open(path) as f:
              text = f.read()
          # Comment out every marauder setup include
          text = re.sub(
              r'^[ \t]*(?://[ \t]*)?#include <(User_Setup_og_marauder|User_Setup_marauder_v8|User_Setup_marauder_pancake)\.h>',
              r'//#include <\1.h>', text, flags=re.MULTILINE)
          # Uncomment the target setup file
          text = text.replace(f'//#include <{tft_setup}.h>', f'#include <{tft_setup}.h>')
          with open(path, 'w') as f:
              f.write(text)
          print(f"User_Setup_Select.h  → #include <{tft_setup}.h>")
          PYEOF

          cp "bible_firmware/$PARTITIONS" bible_firmware/partitions.csv
          echo "partitions.csv → $PARTITIONS"

      # ── 4b. Stamp the commit SHA into the About screen ─────────────────────
      # Arduino IDE can't inject git data, so do it here. Uses the PR head sha on
      # pull_request events (not the synthetic merge commit), else the pushed sha.
      - name: Stamp commit SHA
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 sd_prep/stamp_commit.py
          grep BIBLE_FW_COMMIT bible_firmware/configs.h

      # ── 5. Compile ─────────────────────────────────────────────────────────
      - name: Compile ${{ matrix.board }}
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.fqbn }}" \
            --library "bible_firmware/libraries/TFT_eSPI-ESP32-C5" \
            --build-property "upload.maximum_size=${{ matrix.max_size }}" \
            --output-dir "dist/${{ matrix.board }}" \
            --warnings default \
            bible_firmware

      # ── 6. Rename to the release template ───────────────────────────────────
      #   esp32-library_v<ver>_<board>.bin  (+ _merged / _bootloader / _partitions)
      # Unlike the FlipSocial template, EVERY image carries the board name: V6.1 is a
      # different chip (esp32 vs esp32c5) with a different partition table, so its
      # bootloader/partitions are NOT byte-identical to the C5 boards' and would
      # collide when the release job merges the three matrix artifacts.
      - name: Rename binaries
        run: |
          VER=$(grep -oP '#define\s+BIBLE_FW_VERSION\s+"\K[^"]+' bible_firmware/configs.h)
          echo "Firmware version: $VER"
          mkdir -p out
          D="dist/${{ matrix.board }}"
          B="esp32-library_v${VER}_${{ matrix.short }}"
          cp "$D/bible_firmware.ino.bin" "out/${B}.bin"
          [ -f "$D/bible_firmware.ino.merged.bin" ]     && cp "$D/bible_firmware.ino.merged.bin"     "out/${B}_merged.bin"     || true
          [ -f "$D/bible_firmware.ino.bootloader.bin" ] && cp "$D/bible_firmware.ino.bootloader.bin" "out/${B}_bootloader.bin" || true
          [ -f "$D/bible_firmware.ino.partitions.bin" ] && cp "$D/bible_firmware.ino.partitions.bin" "out/${B}_partitions.bin" || true
          ls -l out

      # ── 7. Artifact (this board's images; collected by package + release) ────
      - name: Upload ${{ matrix.short }} binaries
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.short }}
          path: out/*
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Package — collect every board's .bin, bundle into a single zip, and
  # (optionally) publish a GitHub release.
  # ═══════════════════════════════════════════════════════════════════════════
  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Version (from configs.h) + short commit → drive every artifact name.
      - name: Resolve version & commit
        id: meta
        env:
          GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          VER=$(grep -oP '#define\s+BIBLE_FW_VERSION\s+"\K[^"]+' bible_firmware/configs.h)
          SHORT=${GIT_SHA:0:7}
          echo "version=$VER"                          >> "$GITHUB_OUTPUT"
          echo "commit=$SHORT"                         >> "$GITHUB_OUTPUT"
          echo "zip=esp32-library_v${VER}_${SHORT}"    >> "$GITHUB_OUTPUT"
          echo "Version $VER, commit $SHORT"

      # Pull every board's renamed .bin into a single flat folder.
      - name: Download board binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dl
          merge-multiple: true

      # Build the release folder: the raw bins + one zip that contains them.
      - name: Assemble package
        run: |
          mkdir -p out
          cp dl/*.bin out/
          ( cd out && zip -j "${{ steps.meta.outputs.zip }}.zip" *.bin )
          ls -l out

      # ONE artifact = one download = extract once → the zip + every raw .bin.
      - name: Upload combined package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.zip }}
          path: out/*
          if-no-files-found: error

  # ═══════════════════════════════════════════════════════════════════════════
  # Optional release — on a v* tag push, or a manual run with release=true.
  # Tag / title / bin names follow the initial v1.0.0 release for consistency.
  # ═══════════════════════════════════════════════════════════════════════════
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        run: |
          VER=$(grep -oP '#define\s+BIBLE_FW_VERSION\s+"\K[^"]+' bible_firmware/configs.h)
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dl
          merge-multiple: true

      - name: Create / refresh release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" dl/*.bin \
            --title "$TAG" \
            --notes "Automated build of ESP32 Library $TAG." \
            --target "${{ github.sha }}"
